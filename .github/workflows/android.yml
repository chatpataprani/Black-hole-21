name: Build Black Hole 21 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-fcm-push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify Android Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name": "com.blackhole21.game"' android/app/google-services.json
          grep -q '"project_id": "black-hole-21"' android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Black-Hole-21.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Black-Hole-21-APK
          path: Black-Hole-21.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          TAG="android-v${VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Black-Hole-21.apk --clobber
          else
            gh release create "$TAG" Black-Hole-21.apk --title "Black Hole 21 v${VERSION_NAME}" --notes "Android APK release ${VERSION_NAME} (versionCode ${VERSION_CODE})." --latest
          fi
