name: Finish web push UI integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate browser push into main app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text()
          text = text.replace(
              '<p class="settings-note">Notifications require the Android app and a one-time permission prompt. Not available in the browser yet.</p>',
              '<p class="settings-note">Enable push notifications on this device. Android uses native FCM; browsers use Firebase Web Push.</p>'
          )
          text = text.replace(
              '  <script src="/socket.io/socket.io.js"></script>\n  <script src="app.js"></script>',
              '  <script src="/socket.io/socket.io.js"></script>\n  <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>\n  <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging-compat.js"></script>\n  <script src="web-push.js"></script>\n  <script src="app.js"></script>\n  <script>\n  (() => {\n    const oldToggle = document.getElementById("toggle-notifications");\n    if (!oldToggle) return;\n    const toggle = oldToggle.cloneNode(true);\n    oldToggle.replaceWith(toggle);\n    const note = document.querySelector(".settings-note");\n    const setState = (enabled) => {\n      toggle.setAttribute("aria-checked", String(enabled));\n      if (note) note.textContent = enabled ? "Push notifications are enabled for this browser." : "Enable push notifications to receive admin broadcasts on this browser.";\n    };\n    const saved = localStorage.getItem("bh21_web_push_enabled") === "1";\n    setState(saved);\n    toggle.addEventListener("click", async () => {\n      const next = toggle.getAttribute("aria-checked") !== "true";\n      if (next) {\n        toggle.disabled = true;\n        try {\n          const result = await window.blackHoleWebPush.enable();\n          setState(true);\n          if (typeof showToast === "function") showToast("Notifications enabled.");\n          console.log("[web-push] browser registered; subscribers=", result.subscriberCount);\n        } catch (error) {\n          setState(false);\n          if (typeof showToast === "function") showToast("Notifications failed: " + error.message);\n          console.error("[web-push] enable failed", error);\n        } finally {\n          toggle.disabled = false;\n        }\n      } else {\n        toggle.disabled = true;\n        try {\n          await window.blackHoleWebPush.disable();\n          setState(false);\n          if (typeof showToast === "function") showToast("Notifications disabled.");\n        } catch (error) {\n          console.error("[web-push] disable failed", error);\n        } finally {\n          toggle.disabled = false;\n        }\n      }\n    });\n  })();\n  </script>'
          )
          index.write_text(text)

          sw = Path('public/firebase-messaging-sw.js')
          sw_text = sw.read_text()
          sw_text = sw_text.replace(
              'firebase.messaging();',
              '''const messaging = firebase.messaging();\n\nmessaging.onBackgroundMessage((payload) => {\n  const notification = payload.notification || {};\n  self.registration.showNotification(notification.title || "Black Hole 21", {\n    body: notification.body || "You have a new message.",\n    icon: "/favicon.ico",\n    badge: "/favicon.ico",\n    tag: "black-hole-21-broadcast",\n    renotify: true,\n    data: payload.data || {}\n  });\n});'''
          )
          sw.write_text(sw_text)

          # The dedicated enrollment page was only a temporary diagnostic page.
          Path('public/enable-notifications.html').unlink(missing_ok=True)
          Path('www/enable-notifications.html').unlink(missing_ok=True)
          PY

      - name: Commit final web push integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch public/enable-notifications.html www/enable-notifications.html || true
          git add public/index.html public/firebase-messaging-sw.js public/web-push.js
          git rm --ignore-unmatch .github/workflows/finish-web-push-ui.yml || true
          git commit -m "Finish browser push integration in main app" || exit 0
          git push
