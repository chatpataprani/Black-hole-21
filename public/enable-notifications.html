<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Black Hole 21 — Enable notifications</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a12;color:#f4f6ff;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:520px;width:100%;padding:28px;border:1px solid #292d42;border-radius:18px;background:#111321;box-sizing:border-box}
    h1{margin-top:0}button{width:100%;padding:14px;border:0;border-radius:12px;background:#7567ff;color:white;font-size:16px;font-weight:700}button:disabled{opacity:.55}#status{margin:18px 0;line-height:1.5;white-space:pre-wrap}.token{word-break:break-all;font-size:12px;color:#b9c0d8}
  </style>
</head>
<body>
<main>
  <h1>Black Hole 21 notifications</h1>
  <p>Enable browser push notifications for this browser. The FCM token will be registered with the existing Black Hole 21 backend.</p>
  <button id="enable">Enable notifications</button>
  <div id="status">Ready.</div>
</main>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging-compat.js"></script>
<script>
"use strict";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBkqB_t3LeWON0XZTQnrbStZsXKxkzVAhg",
  authDomain: "black-hole-21.firebaseapp.com",
  projectId: "black-hole-21",
  storageBucket: "black-hole-21.firebasestorage.app",
  messagingSenderId: "8258393999",
  appId: "1:8258393999:web:291ffec222a173f7d71dfa",
  measurementId: "G-E8NGTPHHEZ"
};
const VAPID_KEY = "BMcAsuyx-7Pmkb0al9bebFDGTbH2_7ZgCSEAulpYxGDfaA30gBXM_funlSY5-ZquGumX1OhE7ChbVfSngkGpZw0";
const REGISTER_URL = "/api/push/register";
const statusEl = document.getElementById("status");
const button = document.getElementById("enable");
function status(message){ statusEl.textContent = message; console.log("[web-push]", message); }
async function registerPush(){
  button.disabled = true;
  try {
    if (!window.isSecureContext) throw new Error("Browser push requires HTTPS. Open this page on the Render HTTPS URL.");
    if (!("Notification" in window)) throw new Error("This browser does not support notifications.");
    if (!("serviceWorker" in navigator)) throw new Error("This browser does not support service workers.");

    status("Registering Firebase messaging service worker…");
    const registration = await navigator.serviceWorker.register("/firebase-messaging-sw.js", { scope: "/" });
    await navigator.serviceWorker.ready;

    status("Requesting notification permission…");
    const permission = await Notification.requestPermission();
    if (permission !== "granted") throw new Error("Notification permission is " + permission + ". Allow notifications in the browser settings and try again.");

    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const messaging = firebase.messaging();
    status("Requesting FCM registration token…");
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if (!token) throw new Error("Firebase returned no registration token.");

    console.log("[web-push] FCM registration token:", token);
    const response = await fetch(REGISTER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, platform: "web" })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error("Backend registration failed: HTTP " + response.status + " " + JSON.stringify(result));

    status("Notifications enabled and token registered.\nSubscribers: " + (result.subscriberCount ?? "unknown") + "\n\nToken:\n" + token);
    button.textContent = "Notifications enabled";
    button.disabled = true;

    messaging.onMessage((payload) => {
      console.log("[web-push] foreground message:", payload);
      const notification = payload.notification || {};
      if (Notification.permission === "granted") {
        new Notification(notification.title || "Black Hole 21", {
          body: notification.body || "You have a new message.",
          icon: "/favicon.ico"
        });
      }
    });
  } catch (error) {
    console.error("[web-push] registration failed:", error);
    status("ERROR: " + (error && error.message ? error.message : String(error)));
    button.disabled = false;
  }
}
button.addEventListener("click", registerPush);
</script>
</body>
</html>
